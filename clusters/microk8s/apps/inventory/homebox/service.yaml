apiVersion: v1
kind: Service
metadata:
  name: homebox
  namespace: inventory
  labels:
    app: homebox
    app.kubernetes.io/name: homebox
    app.kubernetes.io/part-of: inventory
spec:
  type: ClusterIP
  selector:
    app: homebox
  ports:
    - name: http
      port: 7745
      targetPort: http
      protocol: TCP
