apiVersion: v1
kind: ConfigMap
metadata:
  name: nest-stream-script
  namespace: frigate
data:
  nest_stream.py: |
    #!/usr/bin/env python3
    import os
    import sys

    # Read HA token from environment (set in frigate container env)
    ha_token = os.environ['HA_TOKEN']
    entity_id = sys.argv[1]

    url = f"http://192.168.2.59:8123/api/camera_proxy_stream/{entity_id}"

    ffmpeg = '/usr/lib/ffmpeg/7.0/bin/ffmpeg'
    os.execvp(ffmpeg, [
        ffmpeg, '-hide_banner', '-loglevel', 'error',
        '-headers', f'Authorization: Bearer {ha_token}\r\n',
        '-i', url,
        '-c:v', 'libx264', '-preset', 'ultrafast', '-tune', 'zerolatency',
        '-f', 'mpegts', 'pipe:1'
    ])
