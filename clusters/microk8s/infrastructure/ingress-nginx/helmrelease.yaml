apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: ingress-nginx
  namespace: ingress-nginx
spec:
  interval: 15m
  chart:
    spec:
      chart: ingress-nginx
      version: 4.11.2
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
        namespace: flux-system
      interval: 15m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controller:
      service:
        type: NodePort
        externalTrafficPolicy: Local
        nodePorts:
          http: 30080
          https: 30443
      extraArgs:
        enable-ssl-chain-completion: "true"
      allowSnippetAnnotations: true
      config:
        # No trusted L7 proxy sits in front of the controller (the router forwards plain TCP to the NodePorts and
        # externalTrafficPolicy: Local keeps the source address). With forwarded headers on, any internet client could
        # send "X-Forwarded-For: 192.168.1.10" and pass every whitelist-source-range (paperclip, trading).
        # Only turn these back on if a proxy that overwrites the header (e.g. a Cloudflare Tunnel) is put in front.
        use-forwarded-headers: "false"
        compute-full-forwarded-for: "false"
        use-proxy-protocol: "false"
        ssl-protocols: "TLSv1.2 TLSv1.3"
      metrics:
        enabled: false
      admissionWebhooks:
        enabled: true
        timeoutSeconds: 30
    defaultBackend:
      enabled: true
      image:
        registry: registry.k8s.io
        image: defaultbackend-amd64
        tag: "1.5"
