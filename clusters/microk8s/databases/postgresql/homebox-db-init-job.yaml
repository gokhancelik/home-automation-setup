apiVersion: batch/v1
kind: Job
metadata:
  name: homebox-db-init
  namespace: data-storage
  labels:
    app: homebox-db-init
    app.kubernetes.io/name: homebox
    app.kubernetes.io/part-of: inventory
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: homebox-db-init
        app.kubernetes.io/name: homebox
        app.kubernetes.io/part-of: inventory
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        kubernetes.io/hostname: ubuntu-desktop
      containers:
        - name: db-init
          image: docker.io/bitnami/postgresql@sha256:2faab3906ce920e5237c38b3a85db4c8dbfb3571f42eb4f935737872d803c5d0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail

              export PGPASSWORD="${POSTGRES_ADMIN_PASSWORD}"
              HOST="postgresql.data-storage.svc.cluster.local"
              ROLE="homebox"
              DB="homebox"
              ROLE_PASSWORD="${HOMEBOX_DB_PASSWORD}"

              echo "Ensuring role ${ROLE} exists"
              ROLE_EXISTS=$(psql -h "${HOST}" -U postgres -d postgres -tAc "SELECT 1 FROM pg_roles WHERE rolname='${ROLE}'")
              if [ "${ROLE_EXISTS}" = "1" ]; then
                psql -h "${HOST}" -U postgres -d postgres -v ON_ERROR_STOP=1 \
                  -c "ALTER ROLE ${ROLE} WITH LOGIN PASSWORD '${ROLE_PASSWORD}'"
              else
                psql -h "${HOST}" -U postgres -d postgres -v ON_ERROR_STOP=1 \
                  -c "CREATE ROLE ${ROLE} WITH LOGIN PASSWORD '${ROLE_PASSWORD}'"
              fi

              echo "Ensuring database ${DB} exists"
              DB_EXISTS=$(psql -h "${HOST}" -U postgres -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='${DB}'")
              if [ "${DB_EXISTS}" = "1" ]; then
                echo "Database ${DB} already exists"
              else
                psql -h "${HOST}" -U postgres -d postgres -v ON_ERROR_STOP=1 \
                  -c "CREATE DATABASE ${DB} OWNER ${ROLE}"
              fi

              psql -h "${HOST}" -U postgres -d postgres -v ON_ERROR_STOP=1 \
                -c "ALTER DATABASE ${DB} OWNER TO ${ROLE}"
              psql -h "${HOST}" -U postgres -d "${DB}" -v ON_ERROR_STOP=1 \
                -c "GRANT ALL ON SCHEMA public TO ${ROLE}"

              echo "HomeBox database initialization complete"
          env:
            - name: POSTGRES_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-credentials
                  key: postgres-password
            - name: HOMEBOX_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: homebox-db-credentials
                  key: password
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
